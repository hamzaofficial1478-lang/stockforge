[project]
name = "stockforge"
version = "0.1.0"
description = "Reads your own design images, recovers the design DNA, and builds new polished editable vector files in the same style."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "fonttools>=4.50",
    "cairosvg>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stockforge = "stockforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stockforge*"]

# The control panel is one HTML file with no build step and no CDN, so it
# ships inside the package rather than being served from anywhere.
[tool.setuptools.package-data]
stockforge = ["ui/*.html"]
